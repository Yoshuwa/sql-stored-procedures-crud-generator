name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CrudGenerator.sln
      - run: dotnet build CrudGenerator.sln --configuration Release --no-restore
      - run: dotnet test CrudGenerator.sln --configuration Release --no-build
