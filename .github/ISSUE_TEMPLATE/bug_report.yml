name: Bug report
description: Report a reproducible problem in SQL Stored Procedures CRUD Generator
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SQL Stored Procedures CRUD Generator. Never include credentials or private schema data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Connect to...\n2. Select...\n3. Click..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, SQL Server version, and application version or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove connection strings, credentials, and private database details.
